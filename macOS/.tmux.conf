# mouse buffer
set-option -g mouse on
# ステータスバーを1秒毎に描画し直す
set-option -g status-interval 1


#### COLOUR (Solarized dark)

# background
set-option -g default-terminal xterm-256color

# statusbar
set-option -g status-position top
set-option -g status-right ''
set-option -g status-justify centre
set-option -g status-bg black #base02
set-option -g status-fg yellow #yellow
set-option -g status-style "default"

# default window title colors
set-window-option -g window-status-style fg=brightblue,bg=default,dim
set-window-option -g window-status-format ' #I #W '
set-window-option -g window-status-separator ''
set-window-option -g mode-keys vi

# active window title colors
set-window-option -g window-status-current-style fg=colour255,bg=colour54,bright
set-window-option -g window-status-current-format ' #I #W '

# pane border
set-option -g pane-border-style fg=colour238,bg=colour238
set-option -g pane-active-border-style fg=colour238,bg=colour238

# message text
set-option -g message-style bg=black,fg=brightred #base02, orange

# pane number display
set-option -g display-panes-active-colour blue #blue
set-option -g display-panes-colour brightred #orange

# clock
set-window-option -g clock-mode-colour green #green


# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send -X copy-pipe "reattach-to-user-namespace pbcopy"
set-option -g default-shell /bin/zsh

# pane border with current directory name
set -g pane-border-status bottom
set -g pane-border-format "#[align=left]#{@claude_status} #[fg=colour148,bg=colour236] #{pane_current_command} #[default]"

# new window in current directory
bind-key c new-window -n "#{b:pane_current_path}" -c "#{pane_current_path}" \; run-shell 'tmux set -p @claude_status "#[fg=colour250,bg=colour238] ⏱ $(date +%m/%d\ %H:%M) #[fg=colour245,bg=colour236] #{b:pane_current_path} "'

# Ctrl+b r でClaude statusリフレッシュ
bind-key r run-shell "~/.claude/hooks/update-status.sh"

# Ctrl+b d でポップアップdiff（全画面）
bind-key d new-window -c "#{pane_current_path}" 'zsh -i -c "ccd"'

# M-i で icb を開く
bind -n M-i run-shell 'PANE=#{pane_id}; NW=$(tmux new-window -c "#{pane_current_path}" -P -F "##{pane_id}"); tmux send-keys -t "$NW" "icb | tmux loadb - && tmux paste-buffer -t $PANE; exit" Enter'

# M-q で editprompt を開く
bind -n M-q run-shell 'PANE=#{pane_id}; NW=$(tmux new-window -c "#{pane_current_path}" -P -F "##{pane_id}"); tmux send-keys -t "$NW" "editprompt open --editor vim --always-copy --target-pane $PANE; exit" Enter'
